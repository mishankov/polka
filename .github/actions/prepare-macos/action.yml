name: Prepare native macOS app
description: Validate the Apple toolchain and resolve Swift package dependencies.

runs:
  using: composite
  steps:
    - name: Check Apple silicon and macOS toolchain
      id: toolchain
      shell: bash
      run: |
        test "$(uname -m)" = arm64
        test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
        xcodebuild -version
        xcrun swift --version
        toolchain=$( { sw_vers -productVersion; xcodebuild -version; xcrun swiftc --version; xcrun --show-sdk-version; } | shasum -a 256 | cut -d' ' -f1)
        echo "key=$toolchain" >> "$GITHUB_OUTPUT"

    - name: Cache Swift dependency downloads
      uses: actions/cache@v6
      with:
        path: |
          native-app/.build/checkouts
          native-app/.build/repositories
          native-app/.build/artifacts
        # Never reuse compiled outputs across toolchains or source revisions.
        key: swift-packages-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('native-app/Package.resolved') }}

    - name: Resolve Swift dependencies
      shell: bash
      run: |
        swift package --package-path native-app resolve
        swift package --package-path tools resolve
