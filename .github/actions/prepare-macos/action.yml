name: Prepare native macOS app
description: Validate the Apple toolchain, restore optional Swift build caches and resolve dependencies.

inputs:
  build-cache:
    description: Build profile to cache (source or optimized); empty caches dependency downloads only.
    required: false
    default: ''
  tools-only:
    description: Prepare only Swift tooling, without resolving or restoring app dependencies.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Check Apple silicon and macOS toolchain
      id: toolchain
      shell: bash
      run: |
        test "$(uname -m)" = arm64
        test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
        xcodebuild -version
        xcrun swift --version
        toolchain=$( { sw_vers -productVersion; xcodebuild -version; xcrun swiftc --version; xcrun --show-sdk-version; } | shasum -a 256 | cut -d' ' -f1)
        build_toolchain=$( { echo "$toolchain"; xcode-select -p; xcrun --show-sdk-path; pwd -P; } | shasum -a 256 | cut -d' ' -f1)
        echo "key=$toolchain" >> "$GITHUB_OUTPUT"
        echo "build_key=$build_toolchain" >> "$GITHUB_OUTPUT"

    - name: Cache Swift tooling intermediates
      if: inputs.build-cache != ''
      uses: actions/cache@v6
      with:
        path: tools/.build
        key: swift-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.build-cache }}-${{ steps.toolchain.outputs.build_key }}-${{ hashFiles('tools/Package.swift') }}-${{ hashFiles('tools/Sources/**', 'tools/Tests/**') }}
        restore-keys: |
          swift-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.build-cache }}-${{ steps.toolchain.outputs.build_key }}-${{ hashFiles('tools/Package.swift') }}-

    - name: Cache Swift app intermediates
      if: inputs.build-cache != '' && inputs.tools-only != 'true'
      uses: actions/cache@v6
      with:
        path: |
          native-app/.build
        # SwiftPM validates inputs on every invocation. Reuse unchanged dependencies
        # across source revisions, but never cross toolchains, paths or build profiles.
        key: swift-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.build-cache }}-${{ steps.toolchain.outputs.build_key }}-${{ hashFiles('native-app/Package.swift', 'native-app/Package.resolved') }}-${{ hashFiles('native-app/Sources/**', 'native-app/Tests/**') }}
        restore-keys: |
          swift-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.build-cache }}-${{ steps.toolchain.outputs.build_key }}-${{ hashFiles('native-app/Package.swift', 'native-app/Package.resolved') }}-

    - name: Cache Swift dependency downloads
      if: inputs.build-cache == '' && inputs.tools-only != 'true'
      uses: actions/cache@v6
      with:
        path: |
          native-app/.build/checkouts
          native-app/.build/repositories
          native-app/.build/artifacts
        # Callers without build caching restore dependency downloads only.
        key: swift-packages-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('native-app/Package.resolved') }}

    - name: Resolve native Swift dependencies
      if: inputs.tools-only != 'true'
      shell: bash
      run: swift package --package-path native-app resolve

    - name: Resolve Swift tooling dependencies
      shell: bash
      run: swift package --package-path tools resolve
