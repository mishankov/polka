name: Prepare native macOS app
description: Validate the Apple toolchain, restore optional Swift build caches and resolve dependencies.

inputs:
  build-cache:
    description: Build profile to cache (source, tooling, optimized or optimized-native); empty caches dependency downloads only.
    required: false
    default: ''
  tools-only:
    description: Prepare only Swift tooling, without resolving or restoring app dependencies.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Check Apple silicon and macOS toolchain
      id: toolchain
      shell: bash
      env:
        BUILD_CACHE_PROFILE: ${{ inputs.build-cache }}
      run: |
        test "$(uname -m)" = arm64
        os_version=$(sw_vers -productVersion)
        test "${os_version%%.*}" -ge 27
        xcode_version=$(xcodebuild -version)
        swift_version=$(xcrun swiftc --version)
        sdk_version=$(xcrun --show-sdk-version)
        sdk_build=$(xcrun --show-sdk-build-version)
        developer_path=$(xcode-select -p)
        sdk_path=$(xcrun --show-sdk-path)
        checkout_path=$(pwd -P)
        printf '%s\n' "$xcode_version" "$swift_version"
        toolchain=$(printf '%s\n' "$os_version" "$xcode_version" "$swift_version" "$sdk_version" | shasum -a 256 | cut -d' ' -f1)
        legacy_build_toolchain=$(printf '%s\n' "$toolchain" "$developer_path" "$sdk_path" "$checkout_path" | shasum -a 256 | cut -d' ' -f1)
        # Host OS patches can share intermediates only with identical compilers,
        # SDK builds and paths. SwiftPM still validates every build invocation.
        os_family=$(cut -d. -f1,2 <<< "$os_version")
        build_toolchain=$(printf '%s\n' "$os_family" "$xcode_version" "$swift_version" "$sdk_version" "$sdk_build" "$developer_path" "$sdk_path" "$checkout_path" | shasum -a 256 | cut -d' ' -f1)
        echo "key=$toolchain" >> "$GITHUB_OUTPUT"
        echo "build_key=$build_toolchain" >> "$GITHUB_OUTPUT"
        echo "legacy_build_key=$legacy_build_toolchain" >> "$GITHUB_OUTPUT"
        # Keep optimized intermediates separate while using SwiftPM's native engine
        # to avoid Swift Build's repeated dependency compilation on hosted runners.
        if [[ "$BUILD_CACHE_PROFILE" == 'optimized-native' ]]; then
          echo 'POLKA_SWIFT_BUILD_SYSTEM=native' >> "$GITHUB_ENV"
        fi

    - name: Cache Swift tooling intermediates
      if: inputs.build-cache != ''
      uses: actions/cache@v6
      with:
        path: tools/.build
        key: swift-tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.build-cache }}-${{ steps.toolchain.outputs.build_key }}-${{ hashFiles('tools/Package.swift', 'scripts/prepare-swift-cache.swift') }}-${{ hashFiles('tools/Sources/**', 'tools/Tests/**') }}
        restore-keys: |
          swift-tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.build-cache }}-${{ steps.toolchain.outputs.build_key }}-${{ hashFiles('tools/Package.swift', 'scripts/prepare-swift-cache.swift') }}-
          swift-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.build-cache }}-${{ steps.toolchain.outputs.legacy_build_key }}-${{ hashFiles('tools/Package.swift') }}-

    - name: Cache Swift app intermediates
      if: inputs.build-cache != '' && inputs.tools-only != 'true'
      uses: actions/cache@v6
      with:
        path: |
          native-app/.build
        # SwiftPM validates inputs on every invocation. Reuse unchanged dependencies
        # across source revisions and host OS patches, but never cross compilers,
        # SDK builds, paths or build profiles.
        key: swift-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.build-cache }}-${{ steps.toolchain.outputs.build_key }}-${{ hashFiles('native-app/Package.swift', 'native-app/Package.resolved', 'scripts/prepare-swift-cache.swift') }}-${{ hashFiles('native-app/Sources/**', 'native-app/Tests/**') }}
        restore-keys: |
          swift-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.build-cache }}-${{ steps.toolchain.outputs.build_key }}-${{ hashFiles('native-app/Package.swift', 'native-app/Package.resolved', 'scripts/prepare-swift-cache.swift') }}-
          swift-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.build-cache }}-${{ steps.toolchain.outputs.legacy_build_key }}-${{ hashFiles('native-app/Package.swift', 'native-app/Package.resolved') }}-

    - name: Restore dependency downloads for the first native-engine build
      if: inputs.build-cache == 'optimized-native' && hashFiles('native-app/.build/checkouts/*/Package.swift') == ''
      uses: actions/cache/restore@v6
      with:
        path: native-app/.build
        key: swift-native-v2-${{ runner.os }}-${{ runner.arch }}-optimized-${{ steps.toolchain.outputs.build_key }}-${{ hashFiles('native-app/Package.swift', 'native-app/Package.resolved', 'scripts/prepare-swift-cache.swift') }}-${{ hashFiles('native-app/Sources/**', 'native-app/Tests/**') }}
        restore-keys: |
          swift-native-v2-${{ runner.os }}-${{ runner.arch }}-optimized-${{ steps.toolchain.outputs.build_key }}-${{ hashFiles('native-app/Package.swift', 'native-app/Package.resolved', 'scripts/prepare-swift-cache.swift') }}-

    - name: Discard incompatible engine outputs while retaining dependency downloads
      if: inputs.build-cache == 'optimized-native' && hashFiles('native-app/.build/build.db') == ''
      shell: bash
      run: |
        shopt -s nullglob dotglob
        for entry in native-app/.build/*; do
          case "${entry##*/}" in
            checkouts|repositories|artifacts) ;;
            *) rm -rf -- "$entry" ;;
          esac
        done

    - name: Cache Swift dependency downloads
      if: inputs.build-cache == '' && inputs.tools-only != 'true'
      uses: actions/cache@v6
      with:
        path: |
          native-app/.build/checkouts
          native-app/.build/repositories
          native-app/.build/artifacts
        # Callers without build caching restore dependency downloads only.
        key: swift-packages-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('native-app/Package.resolved') }}

    - name: Prepare unchanged Swift build inputs
      if: inputs.build-cache != ''
      shell: bash
      env:
        TOOLS_ONLY: ${{ inputs.tools-only }}
      run: |
        packages=(tools)
        if [[ "$TOOLS_ONLY" != 'true' ]]; then packages+=(native-app); fi
        swift scripts/prepare-swift-cache.swift "${packages[@]}"

    - name: Resolve native Swift dependencies
      if: inputs.tools-only != 'true'
      shell: bash
      run: swift package --package-path native-app resolve

    - name: Resolve Swift tooling dependencies
      shell: bash
      run: swift package --package-path tools resolve
