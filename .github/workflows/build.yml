name: build

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**/*.md'
      - '.agents/**'
      - 'release-notes/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**/*.md'
      - '.agents/**'
      - 'release-notes/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify native macOS source
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-macos
        with:
          build-cache: source
      - name: Verify Swift services, UI models, coverage and regression fixtures
        run: ./polka verify --no-desktop --no-tools
      - name: Upload native coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-source-coverage
          path: artifacts/coverage/
          if-no-files-found: error
          retention-days: 7

  tooling:
    name: Verify Swift tooling
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-macos
        with:
          build-cache: tooling
          tools-only: 'true'
      - name: Verify automation, signing, release gates and cancellation
        run: swift test --package-path tools

  package:
    name: Package and test native macOS arm64
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-macos
        with:
          build-cache: optimized-native
      - name: Build optimized native app
        run: ./polka build
      - name: Package ZIP and DMG and smoke-test the relocated optimized app
        run: ./polka package --prebuilt --desktop
      - name: Verify authenticated native update, held installation and relaunch
        run: ./polka desktop updates --prebuilt --release
      - name: Report desktop coverage
        run: |
          echo 'Hosted CI verifies native window, keyboard, scroll, startup, shutdown and relocated-bundle workflows.' >> "$GITHUB_STEP_SUMMARY"
          echo 'CGEvent sessionTap file drags require pre-existing Accessibility approval and are not covered by this hosted job.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload native packages
        uses: actions/upload-artifact@v7
        with:
          name: Polka-macos-arm64
          path: |
            release/native-dev/*.zip
            release/native-dev/*.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload native desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-smoke-diagnostics
          path: artifacts/desktop/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

  macos-arm64:
    # Preserve the existing branch-protection check name.
    name: Verify and package macOS arm64
    needs: [verify, tooling, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Enforce five-minute required-check budget
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" > "$RUNNER_TEMP/ci-jobs.json"
          bash scripts/check-ci-budget.sh "$RUNNER_TEMP/ci-jobs.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Require all hosted macOS checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
