name: build

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**/*.md'
      - '.agents/**'
      - 'release-notes/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**/*.md'
      - '.agents/**'
      - 'release-notes/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify native macOS source
    runs-on: xcode-27
    timeout-minutes: 10
    outputs:
      tree: ${{ steps.tree.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Record checked-out source tree
        id: tree
        run: echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/prepare-macos
        with:
          build-cache: source-native
          tools-configuration: debug
          save-tools-cache: 'false'
      - name: Verify Swift services, UI models, coverage and regression fixtures
        run: ./polka verify --no-desktop --no-tools
      - name: Upload native coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-source-coverage
          path: artifacts/coverage/
          if-no-files-found: error
          retention-days: 7

  tooling:
    name: Verify Swift tooling
    runs-on: xcode-27
    timeout-minutes: 10
    outputs:
      tree: ${{ steps.tree.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Record checked-out source tree
        id: tree
        run: echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/prepare-macos
        with:
          build-cache: tooling
          tools-configuration: debug
          tools-only: 'true'
      - name: Verify automation, signing, release gates and cancellation
        run: swift test --package-path tools --jobs "$POLKA_SWIFT_BUILD_JOBS"

  package:
    name: Package and test native macOS arm64
    runs-on: xcode-27
    timeout-minutes: 10
    outputs:
      tree: ${{ steps.tree.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Record checked-out source tree
        id: tree
        run: echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/prepare-macos
        id: prepare
        with:
          build-cache: optimized-native
          tools-configuration: debug
          save-tools-cache: 'false'
          save-native-cache: 'false'
      - name: Build optimized app
        run: ./polka build --release
      # Retain expensive compilation even if a later integration check fails or
      # the runner reaches its deadline. prepare-macos uses restore-only so
      # post-job cleanup never duplicates this save or trips the 10m timeout.
      - name: Checkpoint compiled native cache
        if: steps.prepare.outputs.native-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: native-app/.build
          key: ${{ steps.prepare.outputs.native-cache-key }}
      - name: Package ZIP and DMG and smoke-test the relocated app
        run: ./polka package --desktop --prebuilt
      - name: Verify authenticated native update, held installation and relaunch
        run: ./polka desktop updates --prebuilt --release
      - name: Report desktop coverage
        run: |
          echo 'Hosted CI verifies native window, keyboard, scroll, startup, shutdown and relocated-bundle workflows.' >> "$GITHUB_STEP_SUMMARY"
          echo 'CGEvent sessionTap file drags require pre-existing Accessibility approval and are not covered by this hosted job.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload native packages
        uses: actions/upload-artifact@v7
        with:
          name: Polka-macos-arm64
          path: |
            release/native-dev/*.zip
            release/native-dev/*.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload native desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-smoke-diagnostics
          path: artifacts/desktop/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

  macos-arm64:
    # Preserve the existing branch-protection check name.
    name: Verify and package macOS arm64
    needs: [verify, tooling, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Report five-minute target and enforce ten-minute execution limit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Failed-job reruns copy successful records with new created_at values
          # but original execution times. Keep history to recover their queues.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all" > "$RUNNER_TEMP/ci-jobs.json"
          bash scripts/check-ci-budget.sh "$RUNNER_TEMP/ci-jobs.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Require all hosted macOS checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
      - name: Record verified source tree
        shell: bash
        env:
          VERIFY_TREE: ${{ needs.verify.outputs.tree }}
          TOOLING_TREE: ${{ needs.tooling.outputs.tree }}
          PACKAGE_TREE: ${{ needs.package.outputs.tree }}
        run: |
          if [[ "$VERIFY_TREE" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$VERIFY_TREE" == "$TOOLING_TREE" ]] \
            && [[ "$VERIFY_TREE" == "$PACKAGE_TREE" ]]; then
            echo "::notice title=verified-source-tree::$VERIFY_TREE"
          fi
