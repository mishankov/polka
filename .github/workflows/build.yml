name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: Verify and package macOS arm64
    # This app requires macOS 27; xcode-27 is the hosted Apple silicon image.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Check Apple silicon and macOS version
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
          node -e 'if (process.platform !== "darwin" || process.arch !== "arm64") process.exit(1)'
          xcodebuild -version

      - run: npm ci
      - name: Prepare Electron binary
        # Electron downloads lazily; finish before Playwright resolves its executable.
        run: node -e 'console.log(require("electron"))'
      - name: Verify types, build, native helpers, unit tests and desktop workflows
        timeout-minutes: 10
        run: npm run verify

      - name: Package arm64 DMG and ZIP
        env:
          # electron-builder skips even ad-hoc signing for pull requests by default.
          # Force the certificate-free identity below; no release secrets are used.
          CSC_FOR_PULL_REQUEST: 'true'
        run: npm run package -- --publish never -c.mac.identity=-

      - name: Verify packaged app signature and disk image
        run: |
          codesign --verify --deep --strict --verbose=2 "release/mac-arm64/Everything App.app"
          for image in release/*.dmg; do
            hdiutil verify "$image"
          done

      - name: Test packaged app
        timeout-minutes: 5
        run: npm run test:packaged

      - uses: actions/upload-artifact@v7
        with:
          name: Everything App-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-smoke-screenshots
          path: /tmp/everything-*.png
          if-no-files-found: ignore
          retention-days: 7
