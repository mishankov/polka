name: build

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**/*.md'
      - '.agents/**'
      - 'release-notes/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**/*.md'
      - '.agents/**'
      - 'release-notes/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify macOS source (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [desktop, workflows]
    # This app requires macOS 27; xcode-27 is the hosted Apple silicon image.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Check Apple silicon and macOS version
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
          node -e 'if (process.platform !== "darwin" || process.arch !== "arm64") process.exit(1)'
          xcodebuild -version

      - run: npm ci
      - name: Prepare Electron binary
        # Electron downloads lazily; finish before Playwright resolves its executable.
        run: node -e 'console.log(require("electron"))'
      - name: Build app and native helpers once
        run: npm run build:prepare
      - name: Verify types, unit tests and desktop workflows
        timeout-minutes: 10
        env:
          # Hosted Vision accurate-model compilation fails; keep native OCR local.
          # OCR unit logic and desktop UI still run with synthetic recognition.
          POLKA_SKIP_NATIVE_OCR: '1'
        run: npm run verify:${{ matrix.suite }}

      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-${{ matrix.suite }}-smoke-screenshots
          path: |
            /tmp/everything-*.png
            artifacts/**/*.png
            artifacts/desktop/**/*.zip
            artifacts/desktop/**/failure.json
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package and test macOS arm64
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Check Apple silicon and macOS version
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
          xcodebuild -version
      - run: npm ci
      - name: Build app and native helpers once
        run: npm run build:prepare
      - name: Package arm64 DMG and ZIP
        env:
          # electron-builder skips even ad-hoc signing for pull requests by default.
          # Force the certificate-free identity below; no release secrets are used.
          CSC_FOR_PULL_REQUEST: 'true'
        run: npm run package:prepared -- --publish never -c.mac.identity=-

      - name: Verify packaged app signature and disk image
        run: |
          codesign --verify --deep --strict --verbose=2 "release/mac-arm64/Polka.app"
          for image in release/*.dmg; do
            hdiutil verify "$image"
          done

      - name: Test packaged app
        timeout-minutes: 5
        run: npm run test:packaged

      - uses: actions/upload-artifact@v7
        with:
          name: Polka-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-smoke-screenshots
          path: |
            /tmp/everything-*.png
            artifacts/**/*.png
            artifacts/desktop/**/*.zip
            artifacts/desktop/**/failure.json
          if-no-files-found: ignore
          retention-days: 7

  updates:
    name: Test macOS update and relaunch (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: ad-hoc
            script: test:updates
          - mode: self-signed
            script: test:updates:self-signed
          - mode: signing-migration
            script: test:updates:signing-migration
    # GUI workflows use separate runners: clipboard, focus and shortcuts are shared.
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Check Apple silicon and macOS version
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
          xcodebuild -version
      - run: npm ci
      - name: Prepare Electron binary
        run: node -e 'console.log(require("electron"))'
      - name: Build app and native helpers once
        run: npm run build:prepare
      - name: Test update and relaunch (${{ matrix.mode }})
        timeout-minutes: 8
        run: npm run ${{ matrix.script }} -- --prebuilt

      - name: Upload updater diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-update-${{ matrix.mode }}-diagnostics
          path: artifacts/desktop/
          if-no-files-found: ignore
          retention-days: 7

  macos-arm64:
    # Retain the existing check name for branch protection and require every job.
    name: Verify and package macOS arm64
    needs: [verify, package, updates]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all macOS checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
