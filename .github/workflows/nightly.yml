name: nightly

on:
  schedule:
    # 01:30 UTC / 04:30 Moscow. Build the master state at preparation time.
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-nightly
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: xcode-27
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: ./.github/actions/prepare-macos
        with:
          build-cache: optimized
          tools-only: 'true'

      - name: Pin master commit and unique nightly version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NIGHTLY_BASE_VERSION=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          export NIGHTLY_BASE_VERSION
          ./polka nightly-prepare

  verify:
    name: Verify native macOS release source
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: ./.github/actions/prepare-macos
        with:
          build-cache: source-native
      - name: Verify Swift services, UI models, coverage and regression fixtures
        timeout-minutes: 25
        run: ./polka verify --no-desktop --no-tools
      - name: Upload native coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-macos-arm64-source-coverage
          path: artifacts/coverage/
          if-no-files-found: error
          retention-days: 7

  tooling:
    name: Verify Swift release tooling
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: ./.github/actions/prepare-macos
        with:
          build-cache: tooling
          tools-only: 'true'
      - name: Verify automation, signing, release gates and cancellation
        run: swift test --package-path tools

  updates:
    name: Test native macOS release update and relaunch
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: ./.github/actions/prepare-macos
        with:
          build-cache: optimized
      - name: Build optimized native fixture app
        run: ./polka build
      - name: Verify native update and relaunch
        timeout-minutes: 15
        run: ./polka desktop updates --prebuilt --release
      - name: Upload native updater diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-macos-arm64-update-diagnostics
          path: artifacts/desktop/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build and verify macOS arm64 release package
    needs: prepare
    environment: release
    env:
      RELEASE_CHANNEL: nightly
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: ./.github/actions/prepare-macos
        with:
          build-cache: optimized
      - name: Build and authenticate update archive, verify packaged app
        env:
          POLKA_SIGNING_P12: ${{ secrets.POLKA_SIGNING_P12 }}
          POLKA_SIGNING_PASSWORD: ${{ secrets.POLKA_SIGNING_PASSWORD }}
          POLKA_SIGNING_CERT_SHA1: ${{ vars.POLKA_SIGNING_CERT_SHA1 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./polka release --desktop
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-asset-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/appcast.xml
            artifacts/release-notes.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-macos-arm64-smoke-screenshots
          path: |
            artifacts/**/*.png
            artifacts/desktop/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish immutable nightly and advance nightly feed
    needs: [prepare, verify, tooling, updates, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nightly-asset-macos-arm64
          path: nightly-assets

      - name: Publish verified prerelease before updating the feed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          cd nightly-assets/release
          sha256sum *.dmg *.zip > checksums.txt
          # Draft retries can replace staging assets; published archives stay immutable.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >/dev/null 2>&1; then
            gh release create "$TAG" --draft --repo "$GITHUB_REPOSITORY" --target "$COMMIT" \
              --prerelease --latest=false --title "Polka ${TAG#v}" \
              --notes-file ../artifacts/release-notes.md
          fi
          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" == "true" ]]; then
            # Drafts without a Git tag are not returned by the REST tag lookup.
            draft_target=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')
            if [[ "$draft_target" != "$COMMIT" ]]; then
              echo 'Nightly draft targets a different source commit.'
              exit 1
            fi
            gh release upload "$TAG" *.dmg *.zip checksums.txt appcast.xml --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --draft=false --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
          else
            tagged_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')
            if [[ "$tagged_commit" != "$COMMIT" ]]; then
              echo 'Nightly tag points at a different source commit.'
              exit 1
            fi
            # A publish-only retry may reuse a completed release, but must verify its bytes.
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease' | grep -qx true
            mkdir ../published
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir ../published
            cmp checksums.txt ../published/checksums.txt
            cmp appcast.xml ../published/appcast.xml
            (cd ../published && sha256sum --check checksums.txt)
          fi
          published_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')
          if [[ "$published_commit" != "$COMMIT" ]]; then
            echo 'Published nightly tag does not match the verified source.'
            exit 1
          fi
          # This permanent prerelease holds only a pointer to immutable archives.
          # Never move its tag or replace an archive already referenced by an appcast.
          if ! gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create nightly --repo "$GITHUB_REPOSITORY" --target "$COMMIT" \
              --prerelease --latest=false --title "Polka nightly channel" \
              --notes "Daily signed builds from master. Select Nightly in Settings → About → Updates."
          fi
          gh release edit nightly --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
          gh release upload nightly appcast.xml --clobber --repo "$GITHUB_REPOSITORY"
