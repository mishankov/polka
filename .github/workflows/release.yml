name: Signed macOS release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing package version to release (must match package.json)
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64]
    environment: release
    concurrency:
      group: signed-release
      cancel-in-progress: false
    env:
      RELEASE_REPOSITORY: ${{ github.repository }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Validate release version
        run: node -e 'if(require("./package.json").version!==process.env.EXPECTED_VERSION) process.exit(1)'
      - run: npm ci
      - run: npm run verify
      - run: npm run release -- --publish
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-arm64-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
