name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example, v1.1.0)
        required: true
        type: string
      prerelease:
        description: Mark the release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: xcode-27
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      safe_tag: ${{ steps.release.outputs.safe_tag }}
      publish_after_upload: ${{ steps.release.outputs.publish_after_upload }}
      has_notes: ${{ steps.release.outputs.has_notes }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-macos
        with:
          build-cache: optimized
          tools-only: 'true'

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ./polka release-prepare

      - name: Preserve validated bilingual release description
        if: steps.release.outputs.has_notes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-${{ steps.release.outputs.safe_tag }}
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify native macOS release source
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: ./.github/actions/prepare-macos
        with:
          build-cache: source-native
      - name: Verify Swift services, UI models, coverage and regression fixtures
        timeout-minutes: 25
        run: ./polka verify --no-desktop --no-tools
      - name: Upload native coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64-source-coverage
          path: artifacts/coverage/
          if-no-files-found: error
          retention-days: 7

  tooling:
    name: Verify Swift release tooling
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: ./.github/actions/prepare-macos
        with:
          build-cache: tooling
          tools-only: 'true'
      - name: Verify automation, signing, release gates and cancellation
        run: swift test --package-path tools

  updates:
    name: Test native macOS release update and relaunch
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: ./.github/actions/prepare-macos
        with:
          build-cache: optimized
      - name: Build optimized native fixture app
        run: ./polka build
      - name: Verify native update and relaunch
        timeout-minutes: 15
        run: ./polka desktop updates --prebuilt --release
      - name: Upload native updater diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64-update-diagnostics
          path: artifacts/desktop/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build and verify macOS arm64 release package
    needs: prepare
    environment: release
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: ./.github/actions/prepare-macos
        with:
          build-cache: optimized
      - name: Build and authenticate update archive, verify packaged app
        env:
          POLKA_SIGNING_P12: ${{ secrets.POLKA_SIGNING_P12 }}
          POLKA_SIGNING_PASSWORD: ${{ secrets.POLKA_SIGNING_PASSWORD }}
          POLKA_SIGNING_CERT_SHA1: ${{ vars.POLKA_SIGNING_CERT_SHA1 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./polka release --desktop
      - uses: actions/upload-artifact@v7
        with:
          name: release-asset-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/appcast.xml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64-smoke-screenshots
          path: |
            artifacts/**/*.png
            artifacts/desktop/**/*.zip
            artifacts/desktop/**/failure.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Upload release assets
    needs: [prepare, verify, tooling, updates, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-asset-macos-arm64
          path: release-assets

      - name: Download validated bilingual release description
        if: needs.prepare.outputs.has_notes == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-notes-${{ needs.prepare.outputs.safe_tag }}
          path: release-notes

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.dmg *.zip > checksums.txt

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          current_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')
          if [[ "$current_commit" != "$COMMIT" ]]; then
            echo 'Release tag changed after preparation. Refusing to upload artifacts.'
            exit 1
          fi
          upload_args=()
          # Draft retries may replace staging assets; published archives are immutable.
          if [[ "$(gh release view "$TAG" --json isDraft --jq '.isDraft' --repo "$GITHUB_REPOSITORY")" == "true" ]]; then
            upload_args+=(--clobber)
          fi
          gh release upload "$TAG" release-assets/*.dmg release-assets/*.zip release-assets/checksums.txt "${upload_args[@]}" --repo "$GITHUB_REPOSITORY"
          # Publish the feed only after every referenced archive is available.
          gh release upload "$TAG" release-assets/appcast.xml "${upload_args[@]}" --repo "$GITHUB_REPOSITORY"

      - name: Synchronize GitHub Release description
        if: needs.prepare.outputs.has_notes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --notes-file release-notes/release-notes.md --repo "$GITHUB_REPOSITORY"

      - name: Publish manually created release
        if: github.event_name == 'workflow_dispatch' && needs.prepare.outputs.publish_after_upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
