name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example, v1.1.0)
        required: true
        type: string
      prerelease:
        description: Mark the release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      safe_tag: ${{ steps.release.outputs.safe_tag }}
      publish_after_upload: ${{ steps.release.outputs.publish_after_upload }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
            publish_after_upload=false
          else
            tag="$REQUESTED_TAG"
            git check-ref-format "refs/tags/$tag"

            if release_is_draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
              publish_after_upload="$release_is_draft"
              echo "Reusing the existing release for $tag."
            else
              create_args=("$tag" --target "$DEFAULT_BRANCH" --generate-notes --draft)
              if [[ "$PRERELEASE" == "true" ]]; then
                create_args+=(--prerelease)
              fi
              gh release create "${create_args[@]}"
              publish_after_upload=true
            fi

            # Draft releases can exist before their Git tag is created.
            # Ensure checkout can resolve the tag before starting downstream jobs.
            remote_tag=$(git ls-remote --refs origin "refs/tags/$tag")
            if [[ -z "$remote_tag" ]]; then
              if [[ "$publish_after_upload" != "true" ]]; then
                echo "Published release $tag is missing its Git tag. Refusing to recreate it."
                exit 1
              fi
              target=$(gh release view "$tag" --json targetCommitish --jq '.targetCommitish')
              target_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$target" --jq '.sha')
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f "ref=refs/tags/$tag" -f "sha=$target_sha"
            fi
          fi

          # Every parallel macOS job must verify/package the same immutable commit.
          git fetch --depth=1 origin "refs/tags/$tag"
          commit=$(git rev-parse 'FETCH_HEAD^{commit}')
          safe_tag=$(printf '%s' "$tag" | sed 's/[^A-Za-z0-9._-]/-/g')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "safe_tag=$safe_tag" >> "$GITHUB_OUTPUT"
          echo "publish_after_upload=$publish_after_upload" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify macOS release source (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [desktop, workflows]
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Validate runner
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
          xcodebuild -version
      - run: npm ci
      - name: Prepare Electron binary
        run: node -e 'console.log(require("electron"))'
      - name: Build app and native helpers once
        # Use longstanding commands so retries of older tags remain supported.
        run: npm run build && npm run native:build
      - name: Verify types, unit tests and desktop workflows
        if: matrix.suite == 'desktop'
        timeout-minutes: 10
        run: npm run typecheck && npm test && npm run test:desktop
      - name: Verify clipboard workflows and media indicator
        if: matrix.suite == 'workflows'
        timeout-minutes: 10
        run: npm run test:workflows && npm run test:media
      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64-${{ matrix.suite }}-smoke-screenshots
          path: |
            /tmp/everything-*.png
            artifacts/emoji/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build and verify macOS arm64 release package
    needs: prepare
    environment: release
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Validate runner
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
          xcodebuild -version

      - run: npm ci
      - name: Prepare Electron binary
        run: node -e 'console.log(require("electron"))'
      - name: Build app and native helpers once
        run: npm run build && npm run native:build
      - name: Build and authenticate update archive, verify packaged app
        env:
          CSC_FOR_PULL_REQUEST: 'true'
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: npm run release -- --prebuilt
      - uses: actions/upload-artifact@v7
        with:
          name: release-asset-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/appcast.xml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64-smoke-screenshots
          path: /tmp/everything-*.png
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Upload release assets
    needs: [prepare, verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-asset-macos-arm64
          path: release-assets

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.dmg *.zip > checksums.txt

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          upload_args=()
          # Draft retries may replace staging assets; published archives are immutable.
          if [[ "$(gh release view "$TAG" --json isDraft --jq '.isDraft' --repo "$GITHUB_REPOSITORY")" == "true" ]]; then
            upload_args+=(--clobber)
          fi
          gh release upload "$TAG" release-assets/*.dmg release-assets/*.zip release-assets/checksums.txt "${upload_args[@]}" --repo "$GITHUB_REPOSITORY"
          # Publish the feed only after every referenced archive is available.
          gh release upload "$TAG" release-assets/appcast.xml "${upload_args[@]}" --repo "$GITHUB_REPOSITORY"

      - name: Publish manually created release
        if: github.event_name == 'workflow_dispatch' && needs.prepare.outputs.publish_after_upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
