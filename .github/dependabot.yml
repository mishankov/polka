version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/prepare-macos
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: swift
    directory: /native-app
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      swift:
        patterns:
          - "*"
      swift-security:
        applies-to: security-updates
        patterns:
          - "*"
